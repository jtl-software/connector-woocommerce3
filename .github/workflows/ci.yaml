name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  status-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      packages: read
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:8.3
      options: --user root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-php83-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php83-

      - run: composer install --no-progress --no-interaction
      - run: composer global require "staabm/annotate-pull-request-from-checkstyle:^1.8"

      - name: PHPCS
        if: always()
        run: bash .github/scripts/run-phpcs.sh

      - name: PHPStan
        if: always()
        run: composer run phpstan -- --error-format=github --memory-limit=2G

  phpunit:
    if: github.event_name != 'schedule'
    needs: [status-check]
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml --bootstrap vendor/autoload.php --log-junit junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-php-${{ matrix.php-version }}
          path: junit.xml
          retention-days: 7

  actionlint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error

  shellcheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1.32.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          path: .github/scripts
          pattern: '*.sh'
          fail_level: error

  plugin-check:
    needs: [status-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Composer install (prod)
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Create wp-env override with WooCommerce dependency
        run: |
          echo '{"plugins":["https://downloads.wordpress.org/plugin/woocommerce.zip"],"testsEnvironment":false}' > .wp-env.override.json

      - name: Create plugin directory with correct WP.org slug
        run: |
          mkdir woo-jtl-connector
          find . -maxdepth 1 -mindepth 1 \
            ! -name '.git' \
            ! -name 'woo-jtl-connector' \
            ! -name '.wp-env.override.json' \
            -exec cp -rl '{}' woo-jtl-connector/ \;

      - name: Run WordPress Plugin Check
        id: plugin-check
        uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          repo-token: ${{ github.token }}
          strict: false
          build-dir: woo-jtl-connector
          wp-version: latest
          categories: |
            general
            plugin_repo
            security
          exclude-checks: |
            trademarks
          exclude-files: |
            phing.phar
            build.sh
            zip-build.sh
            .gitignore
            .gitkeep
            CLAUDE.md
            Db.php
          exclude-directories: |
            .github
            config
            db
            logs
            plugins
            stubs
            tests
            tmp
            vendor
            Wpml

      - name: Plugin Check Summary
        if: always()
        run: |
          python3 << 'EOF'
          import json, os, sys

          results = '/home/runner/work/_temp/plugin-check-results.txt'
          if not os.path.exists(results):
              sys.exit(0)

          errors, warnings = [], []
          current_file = ''
          for line in open(results):
              line = line.rstrip()
              if line.startswith('FILE: '):
                  current_file = line[6:]
              elif line.startswith('[') and current_file:
                  try:
                      for issue in json.loads(line):
                          entry = (current_file, issue)
                          (errors if issue['type'] == 'ERROR' else warnings).append(entry)
                  except json.JSONDecodeError:
                      pass

          def row(f, i):
              msg = i['message'].replace('|', '\\|').replace('\n', ' ')[:120]
              return f'| `{f}` | {i["line"]} | `{i["code"]}` | {msg} |'

          HDR = '| File | Line | Code | Message |\n|---|---|---|---|'
          out = ['## WordPress Plugin Check\n']
          if not errors and not warnings:
              out.append('✅ All checks passed!\n')
          else:
              if errors:
                  out += [f'### ❌ Errors ({len(errors)})\n', HDR] + [row(*e) for e in errors] + ['']
              if warnings:
                  out += [f'### ⚠️ Warnings ({len(warnings)})\n', HDR] + [row(*w) for w in warnings] + ['']

          summary = os.environ.get('GITHUB_STEP_SUMMARY', '')
          out_text = '\n'.join(out) + '\n'
          if summary:
              open(summary, 'a').write(out_text)
          else:
              print(out_text)
          EOF