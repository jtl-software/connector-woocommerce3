name: Build and deploy

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  plugin-check:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/plugin-check.yaml
    secrets: inherit

  build:
    name: Build
    needs: [plugin-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Ensure composer.lock exists
        run: test -f composer.lock

      - name: Composer install (prod)
        run: composer install --no-dev --prefer-dist --classmap-authoritative --no-progress --no-interaction

      - name: Phing build
        run: php ./phing.phar build -Dversion=${{ github.ref_name }} -Dtmpdir=.

      - name: Phing release (ZIP)
        run: php ./phing.phar release -Dversion=${{ github.ref_name }} -Dtmpdir=.

      - name: Upload dist artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Upload ZIP artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip
          path: woo-jtl-connector-${{ github.ref_name }}.zip
          retention-days: 30

  deploy:
    name: SVN deploy to wordpress.org
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SVN_USERNAME: ${{ vars.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
      VERSION: ${{ github.ref_name }}
      SVN_URL: https://plugins.svn.wordpress.org/woo-jtl-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Download dist artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: SVN checkout, sync and tag
        run: bash .github/scripts/svn-deploy.sh
