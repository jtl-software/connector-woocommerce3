name: Update changelog

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-changelog:
    # TEST-ONLY BRANCH — DO NOT MERGE. Exact-match test: points at the SHA of
    # changelog-extractor's throwaway test-exact-match-noop tag, to verify
    # PR #20's release-resolution step finds it via the tags API.
    uses: jtl-software/changelog-extractor/.github/workflows/update-changelog.yaml@efac847cf1ce625575c2334f56a9b83abea6c2eb
    with:
      system-name: woocommerce
    secrets:
      APP_ID: ${{ secrets.CHANGELOG_PAGE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_PAGE_APP_PRIVATE_KEY }}
