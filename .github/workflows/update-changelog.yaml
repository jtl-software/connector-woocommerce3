name: Update changelog

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-changelog:
    # Pinned to the changelog-extractor#18 merge commit (App token scope fix +
    # jtl-changelog-page-writer App switch). The rolling v2 tag hasn't been
    # moved past that yet - switch back to @v2 once it has.
    uses: jtl-software/changelog-extractor/.github/workflows/update-changelog.yaml@e4c939fe6535edeb4b432e6a6945664bd2a6d036 # main, post-#18
    with:
      system-name: woocommerce
    secrets:
      APP_ID: ${{ secrets.CHANGELOG_PAGE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_PAGE_APP_PRIVATE_KEY }}
