name: Update changelog

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-changelog:
    # TEST-ONLY BRANCH — DO NOT MERGE. Points at changelog-extractor's
    # test/verify-app-fix (a no-op-PR fork of PR #18's branch) to live-verify
    # the App switch without writing a real PR into changelog-page. Revert to
    # @v2 before this branch is deleted.
    uses: jtl-software/changelog-extractor/.github/workflows/update-changelog.yaml@test/verify-app-fix
    with:
      system-name: woocommerce
    secrets:
      APP_ID: ${{ secrets.CHANGELOG_PAGE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_PAGE_APP_PRIVATE_KEY }}
