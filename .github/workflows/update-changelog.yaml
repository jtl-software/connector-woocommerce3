name: Update changelog

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-changelog:
    uses: jtl-software/changelog-extractor/.github/workflows/update-changelog.yaml@e4c939fe6535edeb4b432e6a6945664bd2a6d036 # v2.2.0
    with:
      system-name: woocommerce
    secrets:
      APP_ID: ${{ secrets.CHANGELOG_PAGE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_PAGE_APP_PRIVATE_KEY }}
