name: Update changelog

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-changelog:
    uses: jtl-software/changelog-extractor/.github/workflows/update-changelog.yaml@4c634438da42f2eeaca68d1921ff56c801c90f32
    with:
      system-name: woocommerce
    secrets:
      APP_ID: ${{ secrets.CHANGELOG_PAGE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_PAGE_APP_PRIVATE_KEY }}
