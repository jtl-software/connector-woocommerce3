name: Update changelog

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-changelog:
    # TEST-ONLY BRANCH — DO NOT MERGE. Points at changelog-extractor's
    # test/verify-token-fix (a no-op-PR fork of the fixChangelogUpdate PR #18
    # branch) to live-verify the token-scope fix without writing a real PR
    # into changelog-page. Revert to @v2 before this branch is deleted.
    uses: jtl-software/changelog-extractor/.github/workflows/update-changelog.yaml@test/verify-token-fix
    with:
      system-name: woocommerce
    secrets:
      APP_ID: ${{ secrets.GH_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
