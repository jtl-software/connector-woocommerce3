name: Update changelog

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-changelog:
    # TEST-ONLY BRANCH — DO NOT MERGE. Fallback-path test: points at a branch
    # ref (not a SHA) to verify PR #20's release-resolution step correctly
    # falls back to the latest v2.x.y release.
    uses: jtl-software/changelog-extractor/.github/workflows/update-changelog.yaml@test/verify-release-resolution
    with:
      system-name: woocommerce
    secrets:
      APP_ID: ${{ secrets.CHANGELOG_PAGE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_PAGE_APP_PRIVATE_KEY }}
