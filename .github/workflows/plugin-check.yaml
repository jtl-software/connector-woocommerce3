name: WordPress Plugin Check

on:
  workflow_call:

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Composer install (prod)
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Create wp-env override with WooCommerce dependency
        run: |
          echo '{"plugins":["https://downloads.wordpress.org/plugin/woocommerce.zip"],"testsEnvironment":false}' > .wp-env.override.json

      - name: Create plugin directory with correct WP.org slug
        run: |
          mkdir woo-jtl-connector
          find . -maxdepth 1 -mindepth 1 \
            ! -name '.git' \
            ! -name '.claude' \
            ! -name 'woo-jtl-connector' \
            ! -name '.wp-env.override.json' \
            -exec cp -rl '{}' woo-jtl-connector/ \;

      - name: Run WordPress Plugin Check
        id: plugin-check
        uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          repo-token: ${{ github.token }}
          strict: false
          build-dir: woo-jtl-connector
          wp-version: latest
          categories: |
            general
            plugin_repo
            security
          exclude-checks: |
            trademarks
          exclude-files: |
            phing.phar
            build.sh
            zip-build.sh
            .gitignore
            .gitkeep
            CLAUDE.md
            Db.php
          exclude-directories: |
            .github
            config
            db
            logs
            stubs
            tests
            tmp
            vendor
            Wpml

      - name: Plugin Check Summary
        if: always()
        run: |
          python3 << 'EOF'
          import json, os, sys

          results = '/home/runner/work/_temp/plugin-check-results.txt'
          if not os.path.exists(results):
              sys.exit(0)

          errors, warnings = [], []
          current_file = ''
          for line in open(results):
              line = line.rstrip()
              if line.startswith('FILE: '):
                  current_file = line[6:]
              elif line.startswith('[') and current_file:
                  try:
                      for issue in json.loads(line):
                          entry = (current_file, issue)
                          (errors if issue['type'] == 'ERROR' else warnings).append(entry)
                  except json.JSONDecodeError:
                      pass

          def row(f, i):
              msg = i['message'].replace('|', '\\|').replace('\n', ' ')[:120]
              return f'| `{f}` | {i["line"]} | `{i["code"]}` | {msg} |'

          HDR = '| File | Line | Code | Message |\n|---|---|---|---|'
          out = ['## WordPress Plugin Check\n']
          if not errors and not warnings:
              out.append('✅ All checks passed!\n')
          else:
              if errors:
                  out += [f'### ❌ Errors ({len(errors)})\n', HDR] + [row(*e) for e in errors] + ['']
              if warnings:
                  out += [f'### ⚠️ Warnings ({len(warnings)})\n', HDR] + [row(*w) for w in warnings] + ['']

          summary = os.environ.get('GITHUB_STEP_SUMMARY', '')
          out_text = '\n'.join(out) + '\n'
          if summary:
              open(summary, 'a').write(out_text)
          else:
              print(out_text)
          EOF
